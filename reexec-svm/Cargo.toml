[package]
name = "reckn-reexec-svm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reckn Solana (SVM) re-execution backend: deterministic LiteSVM replay of a committed transaction against a committed account snapshot, emitting the same VM-neutral ReplayRecordV1 as the EVM backend."

[dependencies]
# Matches the litesvm/solana v3 stack used across the psyto Solana lab (custos).
litesvm = { path = "vendor/litesvm/crates/litesvm" }
solana-pubkey = "3"
solana-account = "3"
solana-instruction = "3"
solana-transaction = { version = "3", features = ["verify"] }
solana-transaction-error = "3"
solana-message = "3"
solana-keypair = "3.1"
solana-signer = "3"
# The canonical VM-neutral verdict record, shared with the EVM backend so both
# emit byte-identical records / trace hashes.
reckn-record = { path = "../packages/protocol-rs" }
alloy-primitives = "1"
sha2 = "0.10"
