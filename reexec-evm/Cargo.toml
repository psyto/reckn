[package]
name = "reckn-reexec-evm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reckn EVM V1 re-execution backend: deterministic revm replay of a committed CALL plan against a committed prestate, evaluated by a funded predicate."

[lib]
name = "reckn_reexec_evm"

[features]
# Offline, deterministic fixture builders for downstream integration tests.  The
# production crate does not expose this module unless the feature is opted into.
testkit = []

[dependencies]
# Pinned to the version used across the psyto Reth lab (telos) so primitives and
# EVM semantics stay consistent with the rest of the toolchain.
# `optional_no_base_fee` exposes CfgEnv.disable_base_fee: a replay adjudicates
# whether a plan satisfies a predicate, not whether a real fee-paying tx is valid,
# so base-fee gating must be off (a committed real block always has base_fee > 0).
revm = { version = "38", features = ["optional_no_base_fee"] }
# The canonical VM-neutral verdict record (SHA-256 TLV) is shared with every other
# backend so EVM and Solana produce byte-identical records / trace hashes.
reckn-record = { path = "../packages/protocol-rs" }
# Offline Ethereum MPT proof verification. 0.9.5 resolves against the already
# pinned alloy-primitives 1.6.1 used by revm 38; `ethereum` provides TrieAccount.
alloy-trie = { version = "0.9.5", features = ["ethereum"] }
alloy-rlp = "0.3.16"
alloy-consensus = { version = "2.2.0", default-features = false }

[profile.dev]
# revm is heavy; keep debug builds tolerable without losing determinism.
opt-level = 1
