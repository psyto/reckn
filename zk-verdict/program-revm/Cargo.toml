[package]
name = "verdict-program-revm"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-zkvm = { version = "6.0.1" }
# Full re-execution in-guest: real revm, minus the C-based c-kzg/secp precompiles
# (default features) our CALL plans don't need.
revm = { version = "38", default-features = false, features = ["optional_no_base_fee"] }
# In-guest prestate MPT-authenticity vs the committed state_root (same crates and
# versions reexec-evm verifies with, so the guest and the off-chain backend agree).
alloy-trie = { version = "0.9.5", features = ["ethereum"] }
alloy-rlp = "0.3"
alloy-sol-types = "*"
verdict-lib = { path = "../lib" }
reexec-io = { path = "../reexec-io" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[workspace]
