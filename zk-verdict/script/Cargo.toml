[package]
version = "0.1.0"
name = "verdict-script"
edition = "2021"
default-run = "verdict"

[lib]
path = "src/lib.rs"

[[bin]]
name = "verdict"
path = "src/bin/main.rs"

[[bin]]
name = "evm"
path = "src/bin/evm.rs"

[[bin]]
name = "reexec"
path = "src/bin/reexec.rs"

[[bin]]
name = "svm"
path = "src/bin/svm.rs"

[dependencies]
reexec-io = { path = "../reexec-io" }
svm-io = { path = "../svm-io" }
svm-bankhash = { path = "../svm-bankhash" }
solana-pubkey = "3"
solana-keypair = "3.1"
solana-signer = "3"
solana-instruction = "3"
solana-transaction = { version = "3", features = ["verify"] }
# Reuse the real backend's witness+proof builder so the guest verifies exactly the
# MPT proof format reexec-evm produces off-chain.
reckn-reexec-evm = { path = "../../reexec-evm", features = ["testkit"] }
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0.200", default-features = false, features = ["derive"] }
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1.40"
hex = "0.4.3"
alloy-sol-types = { workspace = true }
verdict-lib = { path = "../lib" }
dotenv = "0.15.0"
revm = { version = "38", features = ["optional_no_base_fee"] }
alloy-consensus = { version = "2.2.0", default-features = false }

[build-dependencies]
sp1-build = { version = "6.0.1" }
