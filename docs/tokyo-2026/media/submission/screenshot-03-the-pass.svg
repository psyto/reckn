<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset=".55" stop-color="#090e16"/><stop offset="1" stop-color="#0b1714"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="22"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1480" cy="195" r="260" fill="#50ee9d" opacity=".06" filter="url(#g)"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="104" y="95" fill="#f5f8ff" font-size="29" font-weight="700">=</text><text x="142" y="94" fill="#f5f8ff" font-size="25" font-weight="700">reckn</text><rect x="1280" y="61" width="216" height="41" rx="20" fill="#123326" stroke="#50ee9d"/><circle cx="1305" cy="81" r="5" fill="#50ee9d"/><text x="1322" y="88" fill="#b9ffd8" font-family="monospace" font-size="16" font-weight="700">LIVE ON SEPOLIA</text>
    <text x="104" y="190" fill="#a9bad1" font-family="monospace" font-size="19" letter-spacing="3">03 / THE RECORD IS THE PASS</text>
    <text x="104" y="287" fill="#f5f8ff" font-size="70" font-weight="700" letter-spacing="-3">The record is</text><text x="104" y="365" fill="#50ee9d" font-size="70" font-weight="700" letter-spacing="-3">the pass.</text>
    <text x="104" y="421" fill="#b5c0d0" font-size="28">Same sender. Same pool. Same swap. Only the record changes.</text>
    <rect x="104" y="517" width="400" height="190" rx="20" fill="#111925" stroke="#536074" stroke-width="2" stroke-dasharray="8 8"/><text x="140" y="567" fill="#a9bad1" font-family="monospace" font-size="18" letter-spacing="2">NO RECORD</text><text x="140" y="640" fill="#ff747b" font-size="42" font-weight="700">REFUSED</text><text x="140" y="680" fill="#a9bad1" font-size="21">NoSettledRecord</text>
    <path d="M535 611H593" stroke="#7d8ca1" stroke-width="3"/><path d="M583 600l20 11-20 11" fill="none" stroke="#7d8ca1" stroke-width="3"/>
    <rect x="624" y="500" width="352" height="224" rx="22" fill="#10251e" stroke="#50ee9d" stroke-width="3"/><text x="660" y="555" fill="#a9bad1" font-family="monospace" font-size="18" letter-spacing="2">SETTLED RECORD</text><text x="660" y="630" fill="#50ee9d" font-family="monospace" font-size="34" font-weight="700">1.000000 in</text><text x="660" y="675" fill="#50ee9d" font-family="monospace" font-size="34" font-weight="700">0.987158 out</text><text x="660" y="705" fill="#b9ffd8" font-size="19">SWAP EXECUTED</text>
    <path d="M1007 611H1065" stroke="#7d8ca1" stroke-width="3"/><path d="M1055 600l20 11-20 11" fill="none" stroke="#7d8ca1" stroke-width="3"/>
    <rect x="1096" y="517" width="400" height="190" rx="20" fill="#111925" stroke="#536074" stroke-width="2" stroke-dasharray="8 8"/><text x="1132" y="567" fill="#a9bad1" font-family="monospace" font-size="18" letter-spacing="2">RECORD CLEARED</text><text x="1132" y="640" fill="#ff747b" font-size="42" font-weight="700">REFUSED AGAIN</text><text x="1132" y="680" fill="#a9bad1" font-size="21">the pool closes again</text>
    <text x="800" y="822" text-anchor="middle" fill="#f5f8ff" font-size="27" font-weight="700">The record is not a badge. The pool reads it inside the swap.</text>
