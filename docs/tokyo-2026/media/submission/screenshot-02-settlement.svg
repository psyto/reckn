<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f2030"/><stop offset=".55" stop-color="#080d14"/><stop offset="1" stop-color="#0a1815"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="24"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="770" cy="820" rx="560" ry="130" fill="#50ee9d" opacity=".09" filter="url(#g)"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="104" y="95" fill="#f5f8ff" font-size="29" font-weight="700">=</text><text x="142" y="94" fill="#f5f8ff" font-size="25" font-weight="700">reckn</text><text x="1100" y="91" fill="#a9bad1" font-family="monospace" font-size="18" letter-spacing="2">ZK SETTLEMENT · SEPOLIA</text>
    <text x="104" y="190" fill="#a9bad1" font-family="monospace" font-size="19" letter-spacing="3">02 / THE RIGHT COMES FROM SETTLEMENT</text>
    <text x="104" y="287" fill="#f5f8ff" font-size="70" font-weight="700" letter-spacing="-3">A settlement creates</text><text x="104" y="365" fill="#50ee9d" font-size="70" font-weight="700" letter-spacing="-3">the right to write.</text>
    <text x="104" y="421" fill="#b5c0d0" font-size="28">A program replays the work. When the result matches, anyone can settle.</text>
    <line x1="260" y1="605" x2="1340" y2="605" stroke="#3a4c60" stroke-width="4"/>
    <g><circle cx="300" cy="605" r="56" fill="#111b27" stroke="#5f7188" stroke-width="2"/><text x="276" y="614" fill="#f5f8ff" font-size="25" font-weight="700">01</text><text x="205" y="714" fill="#f5f8ff" font-size="30" font-weight="700">Replay work</text><text x="199" y="752" fill="#a9bad1" font-size="21">same input, same result</text></g>
    <g><circle cx="800" cy="605" r="66" fill="#123226" stroke="#50ee9d" stroke-width="3"/><text x="770" y="614" fill="#50ee9d" font-size="25" font-weight="700">02</text><text x="691" y="714" fill="#50ee9d" font-size="30" font-weight="700">Result matches</text><text x="657" y="752" fill="#a9bad1" font-size="21">proof triggers settlement</text></g>
    <g><circle cx="1300" cy="605" r="56" fill="#111b27" stroke="#5f7188" stroke-width="2"/><text x="1277" y="614" fill="#f5f8ff" font-size="25" font-weight="700">03</text><text x="1171" y="714" fill="#f5f8ff" font-size="30" font-weight="700">One record</text><text x="1145" y="752" fill="#a9bad1" font-size="21">buyer writes it once</text></g>
    <text x="800" y="842" text-anchor="middle" fill="#d7e1ef" font-size="25">No owner. No resolver. No key that can change a matching result.</text>
  </g>
</svg>
