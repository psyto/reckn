<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2c"/><stop offset=".6" stop-color="#080d14"/><stop offset="1" stop-color="#07110f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="120" r="300" fill="#49f39a" opacity=".07" filter="url(#glow)"/>
  <g fill="none" stroke="#314159" opacity=".32"><path d="M0 720H1600M0 800H1600"/><path d="M120 0V900M320 0V900M520 0V900M720 0V900M920 0V900M1120 0V900M1320 0V900M1520 0V900"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="104" y="95" fill="#f5f8ff" font-size="29" font-weight="700">=</text><text x="142" y="94" fill="#f5f8ff" font-size="25" font-weight="700">reckn</text>
    <text x="1255" y="91" fill="#a9bad1" font-family="monospace" font-size="18" letter-spacing="2">ERC-8004 · SEPOLIA</text>
    <text x="104" y="190" fill="#a9bad1" font-family="monospace" font-size="19" letter-spacing="3">01 / THE REPUTATION HOLE</text>
    <text x="104" y="287" fill="#f5f8ff" font-size="70" font-weight="700" letter-spacing="-3">A second address can</text>
    <text x="104" y="365" fill="#50ee9d" font-size="70" font-weight="700" letter-spacing="-3">write the score.</text>
    <text x="104" y="418" fill="#b5c0d0" font-size="28">The standard blocks an agent from scoring itself.</text>
    <text x="104" y="457" fill="#b5c0d0" font-size="28">It does not ask whether the second address did any work.</text>
    <rect x="104" y="540" width="623" height="206" rx="20" fill="#111925" stroke="#8c3e4d" stroke-width="2"/>
    <text x="142" y="592" fill="#a9bad1" font-family="monospace" font-size="18" letter-spacing="2">OWNER ADDRESS</text>
    <circle cx="151" cy="649" r="8" fill="#ff747b"/><text x="174" y="660" fill="#ff747b" font-size="34" font-weight="700">SELF-FEEDBACK NOT ALLOWED</text>
    <text x="142" y="710" fill="#a9bad1" font-family="monospace" font-size="20">the official contract says no</text>
    <path d="M758 642H840" stroke="#8595aa" stroke-width="3"/><path d="M830 631l20 11-20 11" fill="none" stroke="#8595aa" stroke-width="3"/>
    <rect x="873" y="540" width="623" height="206" rx="20" fill="#10201d" stroke="#50ee9d" stroke-width="2"/>
    <text x="911" y="592" fill="#a9bad1" font-family="monospace" font-size="18" letter-spacing="2">SECOND ADDRESS</text>
    <circle cx="920" cy="649" r="8" fill="#50ee9d"/><text x="943" y="660" fill="#50ee9d" font-size="34" font-weight="700">ACCEPTED</text>
    <text x="911" y="710" fill="#a9bad1" font-family="monospace" font-size="20">no work was checked</text>
    <text x="104" y="827" fill="#f5f8ff" font-size="27" font-weight="700">The question moves from “who wrote this?” to “what made it possible to write?”</text>
  </g>
</svg>
