[package]
name = "reckn-escrow-svm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pinocchio settlement program for Reckn's SVM re-execution escrow."

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = "0.9.3"
pinocchio-pubkey = "0.3"
pinocchio-system = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }

[dev-dependencies]
litesvm = { path = "../reexec-svm/vendor/litesvm/crates/litesvm", features = ["precompiles"] }
solana-account = "3"
solana-ed25519-program = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-address = "2.7"
solana-sdk-ids = "3"
solana-signer = "3"
solana-transaction = "3"
ed25519-dalek = "2"
