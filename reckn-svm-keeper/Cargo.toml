[package]
name = "reckn-svm-keeper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
reckn-reexec-svm = { path = "../reexec-svm" }
reckn-record = { path = "../packages/protocol-rs" }
reckn-escrow-svm = { path = "../escrow-svm" }
alloy-primitives = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
ed25519-dalek = "2"
solana-address = "2.7"
solana-pubkey = "3"
solana-ed25519-program = "3"
solana-instruction = "3"
solana-sdk-ids = "3"

[dev-dependencies]
litesvm = { path = "../reexec-svm/vendor/litesvm/crates/litesvm", features = ["precompiles"] }
solana-account = "3"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "3"
tempfile = "3"
