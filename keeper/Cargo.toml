[package]
name = "reckn-keeper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reckn resolver keeper: watch Disputed, re-execute, sign the EIP-712 VerdictCommitment the escrow's resolve() accepts, submit idempotently."

[dependencies]
reckn-reexec-evm = { path = "../reexec-evm" }
# alloy-primitives resolves to the same 1.6.x revm 38 uses, so B256/Address types
# unify with the engine's public API (no conversion boundary).
alloy-primitives = "1"
alloy-signer = "1"
alloy-signer-local = "1"
# Live chain shell: the same Alloy family as the engine's primitives.
alloy = { version = "1.8.3", features = ["providers", "provider-http", "rpc-types", "sol-types", "network", "signer-local"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# Anchor JSON must select the exact revm hardfork used by the backend. Keeping
# this direct dependency at the engine's pinned major prevents a hidden mapper.
revm = { version = "38", features = ["optional_no_base_fee"] }
