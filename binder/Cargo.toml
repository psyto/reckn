[package]
name = "reckn-binder"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reckn cross-VM binder: routes a dispute to the re-execution backend named by its committed backendId and returns a VM-neutral verdict envelope. The record codec is shared, so EVM and Solana verdicts are one type."

[dependencies]
# The canonical VM-neutral verdict record every backend emits.
reckn-record = { path = "../packages/protocol-rs" }
alloy-primitives = "1"
sha2 = "0.10"
reckn-reexec-evm = { path = "../reexec-evm" }
reckn-evm-content = { path = "../reckn-evm-content" }
reckn-reexec-svm = { path = "../reexec-svm" }
reckn-svm-keeper = { path = "../reckn-svm-keeper" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
solana-pubkey = "3"

[dev-dependencies]
# Integration fixtures use the same valid, offline MPT proof generator as the
# EVM backend's own tests.  Keeping this feature dev-only leaves the binder's
# production dependency surface unchanged.
reckn-reexec-evm = { path = "../reexec-evm", features = ["testkit"] }
solana-instruction = "3"
solana-keypair = "3.1"
solana-signer = "3"
solana-transaction = "3"
